name: Release

# Tag a commit with v1.2.0 and push the tag; this builds, tests, and publishes the
# release the launcher will offer to install on the server.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.2.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'
            $tag = "v$version"
          } else {
            $tag = '${{ github.ref_name }}'
            $version = $tag -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' must look like 1.2.0 — the launcher parses it to compare releases."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing $tag (version $version)"

      - name: Restore
        run: dotnet restore

      - name: Test
        # A broken build must never reach the server, so the release stops here if
        # anything fails.
        run: dotnet test --configuration Release --no-restore --verbosity quiet

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/ServerLauncher.App/ServerLauncher.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            --output publish

      - name: Compute checksum
        shell: pwsh
        run: |
          # The launcher verifies the download against this before installing it.
          $hash = (Get-FileHash publish/ServerLauncher.App.exe -Algorithm SHA256).Hash
          $hash | Out-File -FilePath publish/ServerLauncher.App.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/ServerLauncher.App.exe
            publish/ServerLauncher.App.exe.sha256
