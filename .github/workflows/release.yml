name: Release

# Tag a commit with v1.2.0 and push the tag; this builds, tests, and publishes the
# release the launcher will offer to install on the server, plus the Android APK.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.2.0)'
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$VERSION' must look like 1.2.0 — the launcher parses it to compare releases." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (version $VERSION)"

  # The Android app is released separately. Most releases only change the desktop side,
  # and rebuilding the APK for each one added several minutes and a flaky Android SDK
  # download to every release for an artifact that had not changed. Run the Android
  # workflow by hand when the app itself needs shipping.
  release:
    needs: version
    runs-on: windows-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        # A broken build must never reach the server, so the release stops here if
        # anything fails.
        run: dotnet test --configuration Release --no-restore --verbosity quiet

      # Two builds, because the small one needs the .NET Desktop and ASP.NET Core
      # runtimes installed and the standalone one carries them. Each build only ever
      # updates itself with its own kind, so both must be on every release or a
      # standalone install would find nothing to update to.
      - name: Publish (needs runtimes installed)
        shell: pwsh
        run: |
          dotnet publish src/ServerLauncher.App/ServerLauncher.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=${{ needs.version.outputs.version }} `
            --output publish

      - name: Publish (standalone)
        shell: pwsh
        run: |
          dotnet publish src/ServerLauncher.App/ServerLauncher.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ needs.version.outputs.version }} `
            --output publish-standalone

          # Renamed so both can sit on the same release, and so the running build can ask
          # for the asset matching its own kind by name.
          Move-Item publish-standalone/ServerLauncher.exe publish/ServerLauncher-standalone.exe

      - name: Compute checksums
        shell: pwsh
        run: |
          # The launcher verifies each download against these before installing it.
          foreach ($name in 'ServerLauncher.exe', 'ServerLauncher-standalone.exe') {
            $path = "publish/$name"
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            $hash | Out-File -FilePath "$path.sha256" -Encoding ascii -NoNewline
            $mb = [math]::Round((Get-Item $path).Length / 1MB, 1)
            Write-Host "$name  ${mb} MB  SHA256: $hash"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/ServerLauncher.exe
            publish/ServerLauncher.exe.sha256
            publish/ServerLauncher-standalone.exe
            publish/ServerLauncher-standalone.exe.sha256
